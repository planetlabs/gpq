# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
builds:
  - id: gpq
    main: ./cmd/gpq/
    binary: gpq
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    tags:
      - noasm
  - id: gpq-wasm
    main: ./cmd/wasm/
    binary: gpq
    env:
      - CGO_ENABLED=0
    goos:
      - js
    goarch:
      - wasm
    tags:
      - noasm
archives:
  - name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- .Arch }}
dockers_v2:
  - ids:
      - gpq
    images:
      - ghcr.io/planetlabs/gpq
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
    labels:
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
      org.opencontainers.image.url: "https://github.com/planetlabs/{{ .ProjectName }}"
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  use: github-native
homebrew_casks:
  - repository:
      owner: planetlabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    url:
      template: "https://github.com/planetlabs/{{ .ProjectName }}/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/planetlabs/gpq"
    description: "Utility for working with GeoParquet."
    license: "Apache-2.0"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gpq"]
          end
